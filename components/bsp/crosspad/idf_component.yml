
version: "0.0.1"
description: Board Support Package (BSP) for ESP32-S3-CrossPad
url: https://github.com/CrossPad

targets:
  - esp32s3

tags:
  - bsp
  - CrossPad

dependencies:
  idf: ">=5.3" # We use I2C Driver-NG from IDF v5.2 but esp-codec-dev supports from v5.3
  esp_lcd_ili9341: "^2.0.1"

  espressif/esp_lvgl_port:
    version: "^2"
    public: true

  esp_codec_dev:
    version: "~1.3.1"
    public: true

  button:
    version: "^4"
    public: true

  lcd_touch_ft6x36:
    version: "^1"
    public: false
    path: "../../lcd_touch_ft6x36"

  stm32_hal:
    version: "^1"
    public: false
    path: "../../stm32_hal"
